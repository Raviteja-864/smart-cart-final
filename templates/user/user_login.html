{% extends 'base.html' %}

{% block title %}Sign In - SmartCart{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
    <div class="bg-white rounded-3xl border border-slate-200/80 p-8 shadow-xl space-y-6">

        <div class="text-center space-y-2">
            <div class="w-12 h-12 bg-brand-100 text-brand-600 rounded-2xl flex items-center justify-center text-xl mx-auto font-bold">
                <i class="fa-solid fa-user-lock"></i>
            </div>
            <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Welcome Back</h1>
            <p class="text-xs text-slate-500">Sign in to your SmartCart account to view cart & track orders</p>
        </div>

        <form action="/user-login" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Email Address</label>
                <input type="email" name="email" required placeholder="you@example.com"
                       class="w-full bg-slate-50 text-sm text-slate-800 rounded-xl px-4 py-3 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Password</label>
                <input type="password" name="password" required placeholder="••••••••"
                       class="w-full bg-slate-50 text-sm text-slate-800 rounded-xl px-4 py-3 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500">
                <div class="text-right mt-2">
                    <a href="/forgot-password" class="text-xs font-semibold text-brand-600 hover:underline">Forgot Password?</a>
                </div>
            </div>

            <button type="submit" class="w-full bg-brand-600 hover:bg-brand-500 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-brand-500/20 transition-all text-sm">
                Sign In To Account
            </button>
        </form>

        <div class="text-center pt-2 border-t border-slate-100 text-xs text-slate-500 space-y-2">
            <p>Don't have an account yet? <a href="/user-register" class="font-bold text-brand-600 hover:underline">Register Now</a></p>
            <p class="text-[11px] text-slate-400">Are you a store manager? <a href="/admin-login" class="text-slate-600 font-semibold underline">Admin Login</a></p>
        </div>

    </div>
</div>
{% endblock %}
