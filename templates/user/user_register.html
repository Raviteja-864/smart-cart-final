{% extends 'base.html' %}

{% block title %}User Registration - SmartCart{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
    <div class="bg-white rounded-3xl border border-slate-200/80 p-8 shadow-xl space-y-6">
        
        <div class="text-center space-y-2">
            <div class="w-12 h-12 bg-brand-100 text-brand-600 rounded-2xl flex items-center justify-center text-xl mx-auto font-bold border border-brand-200">
                <i class="fa-solid fa-envelope-circle-check"></i>
            </div>
            <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Register with Email OTP</h1>
            <p class="text-xs text-slate-500">Enter your name and email to receive a verification OTP code</p>
        </div>

        <form action="/user-register" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Full Name</label>
                <input type="text" name="name" required placeholder="John Doe" 
                       class="w-full bg-slate-50 text-sm text-slate-800 rounded-xl px-4 py-3 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Email Address</label>
                <input type="email" name="email" required placeholder="you@example.com" 
                       class="w-full bg-slate-50 text-sm text-slate-800 rounded-xl px-4 py-3 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500">
            </div>

            <button type="submit" class="w-full bg-brand-600 hover:bg-brand-500 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-brand-500/20 transition-all text-sm flex items-center justify-center gap-2">
                <i class="fa-solid fa-paper-plane text-xs"></i>
                <span>Send OTP Code to Email</span>
            </button>
        </form>

        <div class="text-center pt-2 border-t border-slate-100 text-xs text-slate-500">
            <p>Already have an account? <a href="/user-login" class="font-bold text-brand-600 hover:underline">Sign In</a></p>
        </div>

    </div>
</div>
{% endblock %}
