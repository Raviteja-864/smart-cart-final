{% extends 'base.html' %}

{% block title %}Add Product - SmartCart Admin{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto px-4 py-10">
    
    <div class="bg-white rounded-3xl border border-slate-200/80 p-6 sm:p-10 shadow-xl space-y-6">
        
        <div class="flex items-center justify-between border-b border-slate-100 pb-4">
            <div>
                <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Add New Product</h1>
                <p class="text-xs text-slate-500 mt-1">Create a new product listing in SmartCart inventory</p>
            </div>
            <a href="/admin/item-list" class="text-xs font-semibold text-slate-500 hover:text-slate-800">
                &larr; Back to Catalog
            </a>
        </div>

        <form action="/admin/add-item" method="POST" enctype="multipart/form-data" class="space-y-6">
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="sm:col-span-2">
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Product Title / Name *</label>
                    <input type="text" name="name" required placeholder="e.g. Apple iPhone 15 Pro" 
                           class="w-full bg-slate-50 text-sm text-slate-800 rounded-xl px-4 py-3 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Category *</label>
                    <select name="category" required class="w-full bg-slate-50 text-sm text-slate-800 rounded-xl px-4 py-3 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500">
                        <option value="Mobiles">Mobiles & Smartphones</option>
                        <option value="Laptops">Laptops & Computers</option>
                        <option value="Audio">Audio & Headphones</option>
                        <option value="Wearables">Smartwatches & Wearables</option>
                        <option value="Footwear">Shoes & Footwear</option>
                        <option value="Gaming">Gaming & Accessories</option>
                        <option value="Fashion">Fashion & Lifestyle</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Product Badge Tag</label>
                    <select name="badge" class="w-full bg-slate-50 text-sm text-slate-800 rounded-xl px-4 py-3 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500">
                        <option value="Bestseller">Bestseller</option>
                        <option value="Hot Deal">Hot Deal</option>
                        <option value="Trending">Trending</option>
                        <option value="New">New Arrival</option>
                        <option value="Top Rated">Top Rated</option>
                        <option value="Popular">Popular Choice</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Selling Price (₹) *</label>
                    <input type="number" step="0.01" name="price" required placeholder="79999" 
                           class="w-full bg-slate-50 text-sm text-slate-800 rounded-xl px-4 py-3 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Original MRP Price (₹)</label>
                    <input type="number" step="0.01" name="original_price" placeholder="89999 (for discount % tag)" 
                           class="w-full bg-slate-50 text-sm text-slate-800 rounded-xl px-4 py-3 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500">
                </div>

                <div class="sm:col-span-2">
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Stock Quantity</label>
                    <input type="number" name="stock_quantity" value="50" placeholder="50" 
                           class="w-full bg-slate-50 text-sm text-slate-800 rounded-xl px-4 py-3 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500">
                </div>

                <div class="sm:col-span-2">
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Product Description *</label>
                    <textarea name="description" rows="4" required placeholder="Enter key features, specifications, and details..." 
                              class="w-full bg-slate-50 text-sm text-slate-800 rounded-xl px-4 py-3 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500"></textarea>
                </div>

                <!-- Dual Image Input Section -->
                <div class="sm:col-span-2 space-y-3 bg-slate-50 p-4 rounded-2xl border border-slate-200">
                    <span class="block text-xs font-bold text-slate-900">Product Image Selection</span>
                    
                    <div>
                        <label class="block text-xs text-slate-600 mb-1">Option A: Upload Image File</label>
                        <input type="file" name="image" accept="image/*" 
                               class="block w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-brand-50 file:text-brand-700 hover:file:bg-brand-100">
                    </div>

                    <div class="text-center text-xs text-slate-400 font-bold uppercase">— OR —</div>

                    <div>
                        <label class="block text-xs text-slate-600 mb-1">Option B: Image Web URL Link</label>
                        <input type="url" name="image_url" placeholder="https://images.unsplash.com/photo-..." 
                               class="w-full bg-white text-xs text-slate-800 rounded-xl px-3.5 py-2.5 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500">
                    </div>
                </div>

            </div>

            <button type="submit" class="w-full bg-brand-600 hover:bg-brand-500 text-white font-bold py-4 rounded-2xl shadow-xl shadow-brand-500/20 transition-all text-sm">
                Publish Product to Store
            </button>
        </form>

    </div>

</div>
{% endblock %}
