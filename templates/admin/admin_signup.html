{% extends 'base.html' %}

{% block title %}Admin Sign Up - SmartCart Portal{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
    <div class="bg-slate-900 text-white rounded-3xl p-8 shadow-2xl space-y-6 border border-slate-800">
        
        <div class="text-center space-y-2">
            <div class="w-12 h-12 bg-indigo-600 text-white rounded-2xl flex items-center justify-center text-xl mx-auto font-bold">
                <i class="fa-solid fa-user-plus"></i>
            </div>
            <h1 class="text-2xl font-extrabold tracking-tight">Register New Admin</h1>
            <p class="text-xs text-slate-400">Create administrative credentials for SmartCart store management</p>
        </div>

        <form action="/admin-signup" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Full Name</label>
                <input type="text" name="name" required placeholder="Admin Name" 
                       class="w-full bg-slate-800 text-sm text-white rounded-xl px-4 py-3 border border-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Work Email</label>
                <input type="email" name="email" required placeholder="admin@smartcart.com" 
                       class="w-full bg-slate-800 text-sm text-white rounded-xl px-4 py-3 border border-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Password</label>
                <input type="password" name="password" required placeholder="••••••••" 
                       class="w-full bg-slate-800 text-sm text-white rounded-xl px-4 py-3 border border-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500">
            </div>

            <button type="submit" class="w-full bg-brand-600 hover:bg-brand-500 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-brand-500/30 transition-all text-sm">
                Submit & Verify OTP
            </button>
        </form>

        <div class="text-center pt-2 border-t border-slate-800 text-xs text-slate-400">
            <p>Already registered? <a href="/admin-login" class="font-bold text-brand-400 hover:underline">Admin Login</a></p>
        </div>

    </div>
</div>
{% endblock %}
