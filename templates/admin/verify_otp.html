{% extends 'base.html' %}

{% block title %}Verify OTP - SmartCart Admin{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
    <div class="bg-slate-900 text-white rounded-3xl p-8 shadow-2xl space-y-6 border border-slate-800 text-center">
        
        <div class="w-12 h-12 bg-amber-500/20 text-amber-400 rounded-2xl flex items-center justify-center text-xl mx-auto font-bold border border-amber-500/30">
            <i class="fa-solid fa-key"></i>
        </div>

        <div class="space-y-1">
            <h1 class="text-2xl font-extrabold tracking-tight">Enter Verification OTP</h1>
            <p class="text-xs text-slate-400">Please enter the 6-digit OTP code sent to your registered email address.</p>
        </div>

        <form action="/verify-otp" method="POST" class="space-y-4">
            <div>
                <input type="text" name="otp" required maxlength="6" placeholder="123456" 
                       class="w-full bg-slate-800 text-center text-2xl font-mono tracking-widest text-white rounded-xl px-4 py-3 border border-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500">
            </div>

            <button type="submit" class="w-full bg-brand-600 hover:bg-brand-500 text-white font-bold py-3.5 rounded-xl shadow-lg transition-all text-sm">
                Verify OTP & Create Account
            </button>
        </form>

    </div>
</div>
{% endblock %}
