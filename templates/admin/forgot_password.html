{% extends 'base.html' %}

{% block title %}Reset Admin Password - SmartCart{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
    <div class="bg-slate-900 text-white rounded-3xl p-8 shadow-2xl space-y-6 border border-slate-800">
        
        <div class="text-center space-y-2">
            <div class="w-12 h-12 bg-rose-500/20 text-rose-400 rounded-2xl flex items-center justify-center text-xl mx-auto font-bold border border-rose-500/30">
                <i class="fa-solid fa-lock-open"></i>
            </div>
            <h1 class="text-2xl font-extrabold tracking-tight">Reset Password</h1>
            <p class="text-xs text-slate-400">Enter your email and new password to recover access</p>
        </div>

        <form action="/admin/forgot-password" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Admin Email</label>
                <input type="email" name="email" required placeholder="admin@smartcart.com" 
                       class="w-full bg-slate-800 text-sm text-white rounded-xl px-4 py-3 border border-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">New Password</label>
                <input type="password" name="new_password" required placeholder="••••••••" 
                       class="w-full bg-slate-800 text-sm text-white rounded-xl px-4 py-3 border border-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500">
            </div>

            <button type="submit" class="w-full bg-brand-600 hover:bg-brand-500 text-white font-bold py-3.5 rounded-xl shadow-lg transition-all text-sm">
                Update Admin Password
            </button>
        </form>

        <div class="text-center pt-2 border-t border-slate-800 text-xs text-slate-400">
            <p>Remembered password? <a href="/admin-login" class="font-bold text-brand-400 hover:underline">Back to Login</a></p>
        </div>

    </div>
</div>
{% endblock %}
