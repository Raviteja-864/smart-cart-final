{% extends 'base.html' %}

{% block title %}Admin Sign In - SmartCart Portal{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
    <div class="bg-slate-900 text-white rounded-3xl p-8 shadow-2xl space-y-6 border border-slate-800">
        
        <div class="text-center space-y-2">
            <div class="w-12 h-12 bg-brand-600 text-white rounded-2xl flex items-center justify-center text-xl mx-auto font-bold shadow-lg shadow-brand-500/30">
                <i class="fa-solid fa-user-shield"></i>
            </div>
            <h1 class="text-2xl font-extrabold tracking-tight">Admin Portal Access</h1>
            <p class="text-xs text-slate-400">Sign in to manage products, view analytics & update orders</p>
        </div>

        <form action="/admin-login" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Admin Email</label>
                <input type="email" name="email" required placeholder="admin@smartcart.com" value="admin@smartcart.com"
                       class="w-full bg-slate-800 text-sm text-white rounded-xl px-4 py-3 border border-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Admin Password</label>
                <input type="password" name="password" required placeholder="••••••••" value="admin123"
                       class="w-full bg-slate-800 text-sm text-white rounded-xl px-4 py-3 border border-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500">
            </div>

            <div class="flex items-center justify-between text-xs text-slate-400">
                <a href="/admin/forgot-password" class="hover:text-white underline">Forgot Password?</a>
            </div>

            <button type="submit" class="w-full bg-brand-600 hover:bg-brand-500 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-brand-500/30 transition-all text-sm">
                Login to Admin Dashboard
            </button>
        </form>

        <div class="text-center pt-2 border-t border-slate-800 text-xs text-slate-400">
            <p>New Administrator? <a href="/admin-signup" class="font-bold text-brand-400 hover:underline">Register Admin Account</a></p>
        </div>

    </div>
</div>
{% endblock %}
